# Free hosting: builds the app and publishes dist/ to the gh-pages branch.
# One-time setup: repo Settings > Pages > Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: Deploy web app
on:
  push:
    branches: [little-learners]
  workflow_dispatch:
permissions:
  contents: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
